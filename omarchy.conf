# Omarchy (Arch + Hyprland) overlay.
#   ln -sf omarchy.conf ~/.config/ghostty/local.conf
#
# Loaded after the shared config. Ghostty processes `config-file` at the
# end of the current file, so the Omarchy theme below wins over ghostty-theme.

# Desktop theme (Super+Ctrl+Shift+Space). Older Omarchy used ~/.config/omarchy.
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"
config-file = ?"~/.config/omarchy/current/theme/ghostty.conf"

# Hyprland: default io_uring backend is slow.
# https://github.com/ghostty-org/ghostty/discussions/3224
async-backend = epoll

# Match Omarchy's stock Ghostty chrome.
window-theme = ghostty
gtk-toolbar-style = flat
resize-overlay = never

# Hyprland owns window opacity (Super+Backspace). Don't stack Ghostty's 0.78.
background-opacity = 1
background-blur = false

# Super is Hyprland's modifier. Super+S is the scratchpad overlay, not
# Ghostty's quick terminal. Super+C/V is Omarchy's universal clipboard.
keybind = super+s=unbind
keybind = super+r=unbind
keybind = super+i=unbind

# Stock Omarchy Ghostty binds (basecamp/omarchy config/ghostty/config).
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
keybind = shift+enter=csi:13;2u
keybind = alt+shift+enter=csi:13;4u
keybind = super+control+shift+alt+arrow_down=resize_split:down,100
keybind = super+control+shift+alt+arrow_up=resize_split:up,100
keybind = super+control+shift+alt+arrow_left=resize_split:left,100
keybind = super+control+shift+alt+arrow_right=resize_split:right,100

mouse-scroll-multiplier = 0.95
shell-integration-features = no-cursor,ssh-env

# Do not set font-family / font-size here.
# `omarchy font set` and `omarchy display text size` sed this repo's `config`.
# After first clone the Mac 16pt will look huge — run:
#   omarchy display text size
# (Omarchy's default terminal size is 9pt at 12px desktop text.)
