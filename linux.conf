# Linux overrides. Enable with:
#   ln -sf linux.conf ~/.config/ghostty/local.conf
#
# Ghostty treats `cmd` as an alias of `super`. The shared config binds
# Super+S/R/I for Mac muscle memory; those keys belong to the compositor
# on GNOME/KDE/Sway (Super+S is the screenshot UI on GNOME).

keybind = super+s=unbind
keybind = super+r=unbind
keybind = super+i=unbind

# Quake-style toggle that does not steal Super.
# Quick terminal is Wayland-only; on X11 this bind is a no-op.
keybind = ctrl+shift+s=toggle_quick_terminal
